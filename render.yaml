# ==============================================================================
# Render Blueprint Specification for IBVAP
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: ibvap-surveillance
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: development
      - key: PROJECT_NAME
        value: "IBVAP - Intelligent Border Video Analytics Platform"
      - key: USE_GPU
        value: "false"
      - key: GPU_DEVICE
        value: "cpu"
      - key: ALLOWED_ORIGINS
        value: "*"
